name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching the project and installer (validation only; no release is published)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build, Package, Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            $v = $env:INPUT_VERSION
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a numeric x.y.z version" }
          [xml] $project = Get-Content src/ShinCapture/ShinCapture.csproj
          if ($v -ne $project.Project.PropertyGroup.Version) { throw "Project version does not match $v" }
          $installer = Get-Content installer/setup.iss -Raw
          if ($installer -notmatch ('#define MyAppVersion "' + [regex]::Escape($v) + '"')) {
            throw "Installer version does not match $v"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Require production signing configuration
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          SIGNPATH_ARTIFACT_CONFIG: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          SIGNPATH_APP_ARTIFACT_CONFIG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIG }}
        run: |
          if ($env:SIGNING_ENABLED -ne 'true') { throw "Code signing must be enabled before building a release" }
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORG_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY', 'SIGNPATH_ARTIFACT_CONFIG', 'SIGNPATH_APP_ARTIFACT_CONFIG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required setting: $name"
            }
          }

      - name: Reject an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing releases" }
          if ("v$env:VERSION" -in $releases) { throw "Release v$env:VERSION already exists; choose a new version" }

      - name: Restore
        run: dotnet restore ShinCapture.sln

      - name: Test
        run: dotnet test ShinCapture.sln --configuration Release --no-restore --verbosity minimal

      - name: Test signature verification
        shell: pwsh
        run: ./tests/ReleaseSigning.Tests.ps1

      - name: Publish (self-contained single-file EXE)
        run: >
          dotnet publish src/ShinCapture/ShinCapture.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      # Inno Setup is not a deep-signing container: sign the app before packaging.
      - name: Upload unsigned application
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-application
          path: publish/ShinCapture.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign application with SignPath
        id: sign-app
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-app
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Verify and stage signed application
        shell: pwsh
        run: |
          ./scripts/Assert-ReleaseSignature.ps1 -Path signed-app/ShinCapture.exe
          Copy-Item -LiteralPath signed-app/ShinCapture.exe -Destination publish/ShinCapture.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "/DMyAppVersion=${{ env.VERSION }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }

      - name: Upload unsigned installer as artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/ShinCapture_Setup_v${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit to SignPath for signing
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: dist-signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Verify signed release and create ZIP
        shell: pwsh
        run: |
          $signedExe = "dist-signed\ShinCapture_Setup_v$env:VERSION.exe"
          ./scripts/Assert-ReleaseSignature.ps1 -Path @('publish/ShinCapture.exe', $signedExe)
          Copy-Item -LiteralPath $signedExe -Destination "dist\ShinCapture_Setup_v$env:VERSION.exe" -Force
          Compress-Archive `
            -Path "dist\ShinCapture_Setup_v$env:VERSION.exe" `
            -DestinationPath "dist\ShinCapture_v$env:VERSION.zip"
          $releaseFiles = Get-ChildItem dist -File
          $releaseFiles | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - name: Save verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShinCapture ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/ShinCapture_Setup_v${{ env.VERSION }}.exe
            dist/ShinCapture_v${{ env.VERSION }}.zip
            dist/SHA256SUMS.txt
